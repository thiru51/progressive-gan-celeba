[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgan"
version = "0.1.0"
description = "DCGAN -> ProGAN component ablation on CelebA at 64x64"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.26",
    "pillow>=10.0",
    # CelebA is distributed as parquet shards; pyarrow reads them without loading
    # a whole 460 MB shard into memory at once.
    "pyarrow>=15.0",
    # scipy.linalg.sqrtm is what makes the Frechet distance computable.
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
